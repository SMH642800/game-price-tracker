name: Refresh Nintendo Catalogues

on:
  schedule:
    # Weekly on Sunday at 12:23 UTC (20:23 Taiwan time).
    - cron: "23 12 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: refresh-nintendo-catalogues-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The external cron backup dispatches this same workflow shortly after
      # the native schedule. Skip the expensive refresh if any run succeeded
      # within the last 24 hours. If the scheduled run failed, the backup can retry.
      - name: Skip if a recent successful refresh exists
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: refresh-nintendo-catalogues.yml
          CURRENT_RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RUNS=$(curl --fail --silent --show-error --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?branch=$BRANCH&status=completed&per_page=20")
          RECENT_SUCCESS=$(printf '%s' "$RUNS" | jq --argjson current "$CURRENT_RUN_ID" \
            '[.workflow_runs[]
              | select(.id != $current)
              | select(.conclusion == "success")
              | select((.updated_at | fromdateiso8601) >= (now - 86400))]
            | length')
          if [ "$RECENT_SUCCESS" -gt 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "A successful catalogue refresh exists within 24 hours; skipping duplicate run."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "No recent successful refresh found; proceeding."
          fi

      - name: Checkout selected branch
        if: steps.dedupe.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        if: steps.dedupe.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.dedupe.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Refresh Taiwan catalogue
        if: steps.dedupe.outputs.should_run == 'true'
        run: python scripts/probe_nintendo_sources.py --country TW --refresh-cache --catalogue-only

      - name: Refresh Hong Kong catalogue
        if: steps.dedupe.outputs.should_run == 'true'
        run: python scripts/probe_nintendo_sources.py --country HK --refresh-cache --catalogue-only

      # Only commit after both regional catalogues have completed validation.
      # If either request fails, the previous committed caches remain untouched.
      - name: Commit refreshed catalogues
        if: steps.dedupe.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .cache/nintendo_tw_catalogue.json .cache/nintendo_hk_catalogue.json
          if git diff --cached --quiet; then
            echo "Nintendo catalogue caches are unchanged"
            exit 0
          fi
          git commit -m "Refresh Nintendo TW/HK catalogues"
          TARGET_BRANCH="$GITHUB_REF_NAME"
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; see this workflow run for details."
            exit 0
          fi
          MESSAGE="⚠️ Nintendo 目錄每週更新失敗；舊快取未提交。分支：${BRANCH}。紀錄：${RUN_URL}"
          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
          curl --fail-with-body --silent --show-error --max-time 15 -H "Content-Type: application/json" -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
