name: Game Price Tracker

on:
  schedule:
    - cron: "6 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "選擇執行模式"
        required: true
        type: choice
        default: check
        options:
          - check
          - test-notification

permissions:
  contents: write

concurrency:
  group: game-price-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare notification history
        run: |
          if [ ! -f notification_state.json ]; then
            echo '{}' > notification_state.json
          fi

      - name: Run selected mode
        id: run_tracker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TRACKER_MODE: ${{ inputs.mode || 'check' }}
        run: |
          if [ "$TRACKER_MODE" = "test-notification" ]; then
            python main.py --test-notification
          else
            python main.py
          fi

      # Save successful per-game state updates even if another game failed.
      - name: Save notification history
        if: always() && steps.run_tracker.outcome != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add notification_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update notification history"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Notification history unchanged"
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          MESSAGE="⚠️ **Game Price Tracker 執行失敗**
          工作流程：${WORKFLOW}
          執行編號：#${RUN_NUMBER}
          觸發方式：${EVENT_NAME}
          分支：${BRANCH}
          詳細紀錄：${RUN_URL}"

          PAYLOAD=$(jq -n --arg content "$MESSAGE" '{content: $content}')
          curl --fail-with-body --silent --show-error             --max-time 15             -H "Content-Type: application/json"             -X POST             -d "$PAYLOAD"             "$DISCORD_WEBHOOK_URL"

      - name: Report successful run to Healthchecks
        if: success()
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -z "$HEALTHCHECKS_PING_URL" ]; then
            echo "HEALTHCHECKS_PING_URL secret is not configured"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 "$HEALTHCHECKS_PING_URL"
