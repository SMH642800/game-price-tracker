
name: Game Price Tracker

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "選擇執行模式"
        required: true
        type: choice
        default: check
        options:
          - check
          - test-notification

permissions:
  contents: write

concurrency:
  group: game-price-tracker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare notification history
        run: |
          if [ ! -f notification_state.json ]; then
            echo '{}' > notification_state.json
          fi

      - name: Run selected mode
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ inputs.mode }}" = "test-notification" ]; then
            python main.py --test-notification
          else
            python main.py
          fi

      - name: Save notification history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add notification_state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update notification history"

            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "Notification history unchanged"
          fi
